version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8002:8002"
    volumes:
      # Mount the project directory to support live-reloading and saving recovered files to the host
      - .:/app
    # Privileged mode helps with low-level disk access (if running on a compatible host)
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      # Map the standard Vite port to the Nginx container port
      - "5173:80"
    depends_on:
      - backend
